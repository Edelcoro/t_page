<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Table Page</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
    body {
        background: whitesmoke;
        font-family: Arial, sans-serif;
    } 
    /* Centers the page with a border and drop-shadow */
    #page {
        width: 928px;
        margin: 0 auto;
        padding: 48px;
        background: white;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    } 
    h1 {
        font: 48pt/1.0em 'Dancing Script', cursive;
        text-align: center;
        text-shadow: 2px 3px 6px darkorange;
    }
    /* The flexible box layout text box, sized slightly smaller than the page */
    #textbox {
        width: 800px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        align-content: flex-start;
    }

    /* --- Custom Styled Video Game Table --- */
    table {
        width: 100%;
        margin: 20px auto;
        border-collapse: collapse;
        border: 1px solid gray;
        box-shadow: 2px 3px 6px gray;
    }
    th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid lightgray;
    }
    /* Sticky Header configuration */
    th {
        position: sticky;
        top: 0;
        background: white;
        color: #333;
        border-bottom: 2px solid gray;
    }
    /* Zebra striping for alternate rows */
    tr:nth-child(odd) {
        background: whitesmoke;
    }
</style>
</head>
<body>

<div id="page">
    <h1>Levels in the video game Hozy</h1>
    
    <div id="textbox">
        <!-- Hozy Levels Table -->
        <table>
            <thead>
                <tr>
                    <th>Level Name</th>
                    <th>Items to Clean</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>The Attic</td>
                    <td>12 items</td>
                </tr>
                <tr>
                    <td>Artist's Workshop</td>
                    <td>24 items</td>
                </tr>
                <tr>
                    <td>Dark Music Hall</td>
                    <td>18 items</td>
                </tr>
                <tr>
                    <td>Small Apartment</td>
                    <td>15 items</td>
                </tr>
                <tr>
                    <td>The Treehouse</td>
                    <td>20 items</td>
                </tr>
                <tr>
                    <td>The Penthouse</td>
                    <td>32 items</td>
                </tr>
                <tr>
                    <td>Old Café</td>
                    <td>28 items</td>
                </tr>
                <tr>
                    <td>Surreal Dreams</td>
                    <td>10 items</td>
                </tr>
                <tr>
                    <td>The Lighthouse</td>
                    <td>25 items</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
</html>
